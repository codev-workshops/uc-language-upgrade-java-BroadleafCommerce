[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-support-assistant"
version = "0.1.0"
description = "Data-driven, multilingual text+voice support assistant built on Google ADK, replicating a Dialogflow CX flow with an in-house LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.40.0",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
adk-support-gateway = "adk_support_assistant.channel.gateway:main"

[tool.setuptools.packages.find]
include = ["adk_support_assistant*"]

# NOTE: flows/ and i18n/ live at the project root (not inside the package) so the
# Dialogflow CX export and locale bundles stay editable/inspectable. The app is
# run from the project directory (editable install / `adk run`); config resolves
# these paths relative to the project root.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
