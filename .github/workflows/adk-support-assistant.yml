name: adk-support-assistant

on:
  push:
    branches: ["**"]
    paths:
      - "adk-support-assistant/**"
      - ".github/workflows/adk-support-assistant.yml"
  pull_request:
    paths:
      - "adk-support-assistant/**"
      - ".github/workflows/adk-support-assistant.yml"

defaults:
  run:
    working-directory: adk-support-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q
